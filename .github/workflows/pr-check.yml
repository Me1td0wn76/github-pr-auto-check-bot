name: PR Auto Check Bot

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# Least privilege: read the PR, write only the summary comment.
permissions:
  contents: read
  pull-requests: write

# Rapid pushes to the same PR: only the latest run matters.
concurrency:
  group: pr-auto-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted bot code
        uses: actions/checkout@v7
        with:
          # Always use the base repository's default branch.
          # Do NOT checkout the incoming PR code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run PR checker
        # PR data reaches the script only through env and the API,
        # never by interpolating ${{ }} expressions into the shell.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 bot/pr_checker.py
